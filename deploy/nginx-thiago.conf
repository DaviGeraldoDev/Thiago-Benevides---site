# Trecho do Nginx para o site do Thiago Benevides (dentro do bloco server { } do domínio).
# Padrão: PADRAO-PUBLICACAO-SITES.md (§4 e §7). Ajuste "root" para a pasta publicada (conteúdo de site/).
root /var/www/thiagobenevides/site;
index index.html;

# Compressão: texto comprime bem; imagens/vídeos/fontes (woff2) já são comprimidos
gzip on;
gzip_comp_level 6;
gzip_min_length 512;
gzip_vary on;
gzip_types text/css application/javascript application/json image/svg+xml text/plain;
# brotli on; brotli_types text/css application/javascript image/svg+xml;   # se o módulo estiver instalado

# HTML sempre revalidado (aponta para os arquivos com hash)
location = / { try_files /index.html =404; add_header Cache-Control "no-cache"; }
location ~* \.html$ { add_header Cache-Control "no-cache"; }
location /links/ { try_files $uri $uri/index.html =404; add_header Cache-Control "no-cache"; }
location /entregaveis/ { try_files $uri $uri/index.html =404; add_header Cache-Control "no-cache"; add_header X-Robots-Tag "noindex, nofollow"; }

# CSS e JS têm hash no nome (app.<hash>.css): cache de 1 ano, imutável
location ~* ^/assets/(css|js)/.+\.(css|js)$ { add_header Cache-Control "public, max-age=31536000, immutable"; }
# Fontes: 1 ano
location ~* ^/assets/fonts/ { add_header Cache-Control "public, max-age=31536000, immutable"; add_header Access-Control-Allow-Origin "*"; }
# Imagens e vídeos: 30 dias (se trocar um arquivo, troque o nome). mp4 com suporte a Range (já padrão) para o seek
location ~* ^/assets/(img|video)/ { add_header Cache-Control "public, max-age=2592000"; }
location ~* \.mp4$ { mp4; add_header Cache-Control "public, max-age=2592000"; }

# Segurança básica
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
